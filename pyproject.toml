[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplevi"
version = "0.1.0"
description = "A reproducibility package for Variational Inference experiments."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
  { name = "Madelyn Andersen", email = "madelyna@mit.edu" }
]

# Core deps used almost everywhere
dependencies = [
  "numpy>=1.22",
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/madelynandersen/simplevi"
Repository = "https://github.com/madelynandersen/simplevi"

[project.optional-dependencies]
# NumPyro / JAX stack
numpyro = [
  "jax>=0.4",
  "jaxlib>=0.4",
  "numpyro>=0.13",
]

# PyMC stack
pymc = [
  "pymc>=5.0",
  "pytensor>=2.0",
]

# TensorFlow Probability stack
tfp = [
  "tensorflow>=2.15",
  "tensorflow_probability>=0.24",
]

# Convenience extra to install everything
all = [
  "simplevi[numpyro,pymc,tfp]",
]

[tool.setuptools]
packages = ["modulars"]